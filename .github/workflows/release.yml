name: Release

# Tag push (`vX.Y.Z`) triggers a real release. `workflow_dispatch` with
# `dry_run` (default true) builds every artifact but skips every publish
# step. See RELEASE.md.
#
# Distribution channels:
#   1. GitHub Release  -- raw per-platform binaries + .sha256 checksums
#   2. npm             -- `roust-<platform>` packages carrying the binary,
#                         pulled in as optionalDependencies of `roust`
#   3. crates.io       -- `cargo install roust` / build from source
on:
  push:
    # Strict vX.Y.Z only (per RELEASE.md) -- a loose "v*" would let a typo'd
    # or experimental tag (v-test, v0.2.0rc1) trigger a REAL publish, since a
    # tag push always runs the full publish path.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only -- skip npm, crates.io, and GitHub Release publish steps"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Non-empty only when this is an intentional dry run (manual dispatch with
  # the box checked). A tag push is always a real release.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ env.DRY_RUN }}
    steps:
      - name: Report mode
        run: |
          if [ "${{ env.DRY_RUN }}" = "true" ]; then
            echo "::notice::Dry run -- artifacts will be built, publish steps will be skipped."
          else
            echo "::notice::Real release for ${{ github.ref_name }} -- publish steps will run."
          fi

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        working-directory: roust-rs
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # cargo must link aarch64 objects with the cross-gcc, not host ld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary and checksum
        shell: bash
        run: |
          # Asset names are what the npm wrapper's download fallback expects:
          # roust-<target>[.exe] plus a companion .sha256.
          binary_name="roust"
          asset_name="roust-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            binary_name="roust.exe"
            asset_name="${asset_name}.exe"
          fi
          mkdir -p release-assets
          cp "roust-rs/target/${{ matrix.target }}/release/${binary_name}" "release-assets/${asset_name}"
          cd release-assets
          # macOS lacks sha256sum; Windows git-bash lacks shasum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset_name}" > "${asset_name}.sha256"
          else
            shasum -a 256 "${asset_name}" > "${asset_name}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: release-assets/*

      - name: Set up Node
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform package to npm
        if: needs.plan.outputs.dry_run != 'true'
        shell: bash
        run: |
          PKG_DIR=$(node npm/prepare-platform-package.mjs --target ${{ matrix.target }})
          npm publish "$PKG_DIR" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run platform package (build only)
        if: needs.plan.outputs.dry_run == 'true'
        shell: bash
        run: |
          PKG_DIR=$(node npm/prepare-platform-package.mjs --target ${{ matrix.target }})
          echo "::notice::Platform package staged at ${PKG_DIR} (publish skipped)"
          cat "${PKG_DIR}/package.json"

  publish-npm:
    name: Publish to npm
    needs: [plan, build-binaries]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Pin platform packages as optionalDependencies
        run: node npm/sync-optional-deps.mjs

      - name: Publish main package
        working-directory: npm/roust
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    needs: [plan, build-binaries]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        working-directory: roust-rs
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [plan, build-binaries]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
